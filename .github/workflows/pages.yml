name: Pages

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'example.env']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'example.env']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.39.4
      - name: Make docker-compose available
        run: echo "$GITHUB_WORKSPACE/.github/bin" >> "$GITHUB_PATH"
      - name: Check JavaScript
        run: docker-compose run --build --rm -T js-check
      - name: Test and build the site
        run: docker-compose run --build --rm -T test
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
